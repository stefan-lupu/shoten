symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    # Setat explicit (nu implicit din bibliotecă) — o cerere de resetare pe
    # oră per cont. Protecția per-IP (împotriva încercării mai multor emailuri
    # diferite) e adăugată separat, vezi config/packages/rate_limiter.yaml.
    throttle_limit: 3600
