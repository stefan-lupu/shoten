security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        # used to reload user from session & other features (e.g. switch_user)

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            # Protecție brute-force: după 5 încercări eșuate (pe combinația
            # email+IP), contul e blocat temporar 5 minute.
            login_throttling:
                max_attempts: 5
                interval: '5 minutes'
            logout:
                path: app_logout
                # where to redirect after logout
                # target: app_any_route

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    role_hierarchy:
        # ROLE_ADMIN_PANEL și ROLE_ORDERS_VIEWER sunt roluri "umbrelă", nu se
        # atribuie direct unui utilizator — servesc doar ca poartă comună de
        # acces (vezi access_control mai jos și #[IsGranted] din controllerele
        # de admin), astfel încât un rol specializat (comenzi/financiar/
        # gestionar) să nu aibă nevoie și de ROLE_ADMIN ca să intre în /admin.
        # ROLE_WHOLESALE nu apare aici ca țintă a nimănui — e un rol paralel
        # cu ROLE_USER (acces la prețuri angro), nu unul ierarhic, atribuit
        # doar prin aprobare manuală (vezi tasks/15-conturi-angro.md). Apare
        # doar ca beneficiu al ROLE_ADMIN, ca un admin să poată vedea/testa
        # magazinul exact cum îl vede un cont angro aprobat.
        ROLE_ADMIN: [ROLE_USER, ROLE_ADMIN_PANEL, ROLE_ORDERS_MANAGER, ROLE_FINANCE_MANAGER, ROLE_STOCK_MANAGER, ROLE_CATALOG_VIEWER, ROLE_WHOLESALE]
        ROLE_ORDERS_MANAGER: [ROLE_ADMIN_PANEL, ROLE_ORDERS_VIEWER]
        ROLE_FINANCE_MANAGER: [ROLE_ADMIN_PANEL, ROLE_ORDERS_VIEWER]
        ROLE_STOCK_MANAGER: [ROLE_ADMIN_PANEL, ROLE_CATALOG_VIEWER]

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN_PANEL }
        # Ancorat cu ($|/) — altfel „^/cont" prinde și „/contact" (pagina de
        # contact, publică), nu doar „/cont" și „/cont/...".
        - { path: ^/cont($|/), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
